name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.x'
          - os: ubuntu-latest
            go: stable
          - os: windows-latest
            go: stable
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Check reachable dependency vulnerabilities
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Check pure-Go build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o "${RUNNER_TEMP}/isup-build" .
